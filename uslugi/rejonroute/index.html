const payload=JSON.parse(document.getElementById('encrypted-content').textContent),storeName='rejonpro-preview-v1';
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const to64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes)));
const form=document.getElementById('login'),input=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
async function openPage(key){
 const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv),additionalData:new TextEncoder().encode(payload.aad)},key,from64(payload.data));
 const stream=new Blob([decoded]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 // DOMParser nie uruchamia skryptów. Po wymianie dokumentu odtwarzamy je jawnie.
 const scripts=[...doc.querySelectorAll('script')].map(s=>({attrs:[...s.attributes].map(a=>[a.name,a.value]),text:s.textContent}));
 doc.querySelectorAll('script').forEach(s=>s.remove());
 document.documentElement.replaceWith(document.importNode(doc.documentElement,true));
 for(const spec of scripts){const script=document.createElement('script');for(const [name,value] of spec.attrs)script.setAttribute(name,value);script.textContent=spec.text;document.body.appendChild(script)}
}
function save(key){return crypto.subtle.exportKey('raw',key).then(raw=>{try{sessionStorage.setItem(storeName,JSON.stringify({salt:payload.salt,key:to64(raw),expires:Date.now()+8*60*60*1000}))}catch{}})}
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;error.textContent='';try{
 if(!crypto.subtle||!window.DecompressionStream)throw Error('browser');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:from64(payload.salt),iterations:payload.iterations},material,{name:'AES-GCM',length:256},true,['decrypt']);
 const check=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv),additionalData:new TextEncoder().encode(payload.aad)},key,from64(payload.data));

 }catch(e){error.textContent=e.message==='browser'?'Otwórz podgląd w aktualnej przeglądarce przez HTTPS lub localhost.':'Nie udało się otworzyć podglądu. Sprawdź hasło i spróbuj ponownie.';button.disabled=false;input.focus();}
