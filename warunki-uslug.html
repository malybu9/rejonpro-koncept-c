const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const to64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes)));
const form=document.getElementById('login'),input=document.getElementById('password'),button=document.getElementById('submit'),error=document.getElementById('error');
async function openPage(key){
 const decoded=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(payload.iv),additionalData:new TextEncoder().encode(payload.aad)},key,from64(payload.data));
 const stream=new Blob([decoded]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 const doc=new DOMParser().parseFromString(html,'text/html');
 // DOMParser nie uruchamia skryptów. Po wymianie dokumentu odtwarzamy je jawnie.
 const scripts=[...doc.querySelectorAll('script')].map(s=>({attrs:[...s.attributes].map(a=>[a.name,a.value]),text:s.textContent}));
